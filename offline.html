<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Mode - Sikumbang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        
        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        p {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-family: 'Poppins', sans-serif;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }
        
        .btn-secondary:hover {
            background: #d5dbdb;
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 30px;
            text-align: left;
            border-radius: 4px;
        }
        
        .info-box h3 {
            color: #2c3e50;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .info-box ul {
            color: #7f8c8d;
            font-size: 13px;
            list-style: none;
            padding-left: 0;
        }
        
        .info-box li {
            margin-bottom: 6px;
            padding-left: 20px;
            position: relative;
        }
        
        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">📡</div>
        
        <h1>Mode Offline</h1>
        <p>Anda sedang dalam mode offline. Beberapa fitur mungkin tidak tersedia.</p>
        
        <div class="button-group">
            <button class="btn btn-primary" onclick="tryReload()">
                🔄 Coba Koneksi Lagi
            </button>
            <a href="admin/index.php" class="btn btn-secondary">
                👨‍💼 Dashboard Admin
            </a>
            <a href="pegawai/index.php" class="btn btn-secondary">
                👤 Dashboard Pegawai
            </a>
        </div>
        
        <div class="info-box">
            <h3>Tersedia Offline:</h3>
            <ul>
                <li>Dashboard (tampilan cache)</li>
                <li>Navigasi menu</li>
                <li>Data yang sudah dimuat</li>
            </ul>
        </div>
    </div>
    
    <script>
        function tryReload() {
            // Test connection
            fetch('/Sistem Kehumasan/KP/admin/index.php', { method: 'HEAD' })
                .then(() => {
                    location.reload();
                })
                .catch(() => {
                    alert('Masih offline. Silakan periksa koneksi internet Anda.');
                });
        }
        
        // Auto check connection every 5 seconds
        setInterval(() => {
            fetch('/Sistem Kehumasan/KP/service-worker.js', { method: 'HEAD' })
                .then(() => {
                    // Connection restored
                    location.reload();
                })
                .catch(() => {
                    // Still offline
                });
        }, 5000);
    </script>
</body>
</html>
